# Publishes Flipper whenever main changes.
#
# The version comes from "## Version:" in Flipper.toc.
#
#   1. A push to main runs the "tag" job. If no tag v<version> exists yet, it
#      creates one and starts this workflow again on that tag.
#   2. The run on the tag does the "package" job: it builds the zip, makes a
#      GitHub release and uploads the file to CurseForge.
#
# If the tag already exists nothing is published, so a merge only releases
# when it raises the version.
#
# CurseForge upload needs two things (see README):
#   - repository secret CF_API_KEY (a CurseForge API token)
#   - a line "## X-Curse-Project-ID: <id>" in Flipper.toc
#
# "Run workflow" on main (manual) publishes the current version again,
# e.g. after adding the secret.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Flipper.toc
        id: version
        run: |
          version=$(grep -m1 '^## Version:' Flipper.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          if [ -z "$version" ]; then
            echo "No '## Version:' line found in Flipper.toc" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Flipper $TAG"
          git push origin "$TAG"

      - name: Start the release for this tag
        if: steps.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

  package:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
